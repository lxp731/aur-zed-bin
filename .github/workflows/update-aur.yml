# 自动更新 zed-bin：检测 Zed 官方新版本 -> 更新 PKGBUILD/.SRCINFO -> 推送到 GitHub 和 AUR
#
# 仓库结构（两个仓库内容不同）：
#   - GitHub 仓库（本仓库，master）：开发镜像，含 PKGBUILD/.SRCINFO/.github/scripts 等
#   - AUR 仓库（aur.archlinux.org/zed-bin）：只含顶层文件（PKGBUILD/.SRCINFO/.gitignore）
#     —— AUR 的 push hook 会拒绝任何包含子目录的提交！
#
# 流程：
#   - 定时（每 6 小时）检查 zed-industries/zed 的最新 stable release
#   - 发现新版本：bump pkgver -> 刷新 sha256sums -> 重新生成 .SRCINFO -> 提交并 push 到 GitHub
#   - 无条件把最新的 PKGBUILD/.SRCINFO 同步到 AUR（无变化时为空操作）
#   - 手动 push 到这个 GitHub 仓库的 PKGBUILD/.SRCINFO 改动也会被同步到 AUR（on: push）
#
# 使用前配置（一次性）：
#   1. 在 GitHub 上创建仓库并把本目录推上去（保留 master 分支名）
#   2. 在 Settings -> Secrets and variables -> Actions 添加 secret：
#        AUR_SSH_PRIVATE_KEY = 你在 AUR 账号里注册过的 SSH 私钥内容
#   3. 手动跑一次 workflow（Actions -> Update zed-bin on AUR -> Run workflow）验证
name: Update zed-bin on AUR

on:
  schedule:
    # 每 6 小时检查一次（UTC 时间的 :17 分触发）
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      # 容器镜像默认没有 git/openssh：必须先装好再 checkout，否则 checkout 会
      # 退化为 REST API 下载 tar 包（没有 .git 目录，后续 git 操作全部失败），
      # 且 AUR 推送（SSH）也依赖 openssh
      - name: Ensure tools (git/curl/openssh)
        run: pacman -Sy --noconfirm --needed git curl openssh

      # 完整克隆（fetch-depth: 0）：浅克隆缺少中间提交，
      # 会导致 push 时被判定为"非快进"而拒绝
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # makepkg 拒绝以 root 运行，因此用 builder 用户执行更新脚本；
      # 工作区 chown 给 builder 后，root 再跑 git 会触发 dubious ownership 校验，
      # 先加 safe.directory 白名单（写入全局配置，本 job 后续步骤均生效）
      - name: Check for new Zed release and update PKGBUILD
        id: update
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          before="$(git rev-parse HEAD)"
          su builder -s /bin/bash -c "bash '$GITHUB_WORKSPACE/scripts/update-pkgbuild.sh'"
          after="$(git rev-parse HEAD)"
          if [ "$before" != "$after" ] || [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # 无条件推送 GitHub（无新提交时是空操作）
      - name: Push to GitHub
        run: git push origin "HEAD:${GITHUB_REF_NAME}"

      # 同步到 AUR：单独克隆一份干净仓库（只有顶层文件），只拷贝
      # PKGBUILD/.SRCINFO 两个文件。无改动时 push 为空操作；一旦 GitHub
      # 领先（含上次同步失败、手动提交等场景），自动把 AUR 补齐。
      - name: Sync PKGBUILD/.SRCINFO to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          # 显式覆盖 GIT_SSH_COMMAND（checkout 可能注入了自己的 SSH 配置），
          # -F /dev/null 不读任何 ssh 配置文件，全部参数走命令行；
          # 连接安全性由 AUR 私钥本身保证
          export GIT_SSH_COMMAND="ssh -F /dev/null -i '$HOME/.ssh/aur' -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          rm -rf "$HOME/aur-sync"
          git clone "ssh://aur@aur.archlinux.org/zed-bin.git" "$HOME/aur-sync"
          cd "$HOME/aur-sync"
          git config user.name "knight731"
          git config user.email "liuxiaopeng731@gmail.com"
          cp "$GITHUB_WORKSPACE/PKGBUILD" "$GITHUB_WORKSPACE/.SRCINFO" .
          if git status --porcelain | grep -qE 'PKGBUILD|\.SRCINFO'; then
            pkgver="$(sed -n 's/^pkgver=//p' PKGBUILD)"
            pkgrel="$(sed -n 's/^pkgrel=//p' PKGBUILD)"
            git add PKGBUILD .SRCINFO
            git commit -m "upgpkg: zed-bin ${pkgver}-${pkgrel}"
          fi
          git push origin master
