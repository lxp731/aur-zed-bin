name: Update zed-bin on AUR

on:
  schedule:
    - cron: '15 */8 * * *'
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Ensure tools (git/curl/openssh/pacman-contrib)
        run: pacman -Sy --noconfirm --needed git curl openssh pacman-contrib
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for new Zed release and update PKGBUILD
        id: update
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          before="$(git rev-parse HEAD)"
          su builder -s /bin/bash -c "bash '$GITHUB_WORKSPACE/scripts/update-pkgbuild.sh'"
          after="$(git rev-parse HEAD)"
          if [ "$before" != "$after" ] || [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to GitHub
        run: git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Sync PKGBUILD/.SRCINFO to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          # 显式覆盖 GIT_SSH_COMMAND（checkout 可能注入了自己的 SSH 配置），
          # -F /dev/null 不读任何 ssh 配置文件，全部参数走命令行；
          # 连接安全性由 AUR 私钥本身保证
          export GIT_SSH_COMMAND="ssh -F /dev/null -i '$HOME/.ssh/aur' -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          rm -rf "$HOME/aur-sync"
          git clone "ssh://aur@aur.archlinux.org/zed-bin.git" "$HOME/aur-sync"
          cd "$HOME/aur-sync"
          git config user.name "knight731"
          git config user.email "liuxiaopeng731@gmail.com"
          cp "$GITHUB_WORKSPACE/PKGBUILD" "$GITHUB_WORKSPACE/.SRCINFO" .
          if git status --porcelain | grep -qE 'PKGBUILD|\.SRCINFO'; then
            pkgver="$(sed -n 's/^pkgver=//p' PKGBUILD)"
            pkgrel="$(sed -n 's/^pkgrel=//p' PKGBUILD)"
            git add PKGBUILD .SRCINFO
            git commit -m "upgpkg: zed-bin ${pkgver}-${pkgrel}"
          fi
          git push origin master
